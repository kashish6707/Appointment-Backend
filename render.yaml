# Render Blueprint for the Clinically API (free web service).
# Render dashboard → New → Blueprint → pick this repo. Fill in the "sync: false" values when asked.
services:
  - type: web
    name: clinically-api
    runtime: python
    plan: free
    region: singapore # closest Render region to India
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start: they're quick, and the free plan has no pre-deploy step.
    # One worker only: live-update rooms live in memory (app/realtime.py).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/ping # no database: lets Neon sleep when idle
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL # Neon connection string (postgresql://…?sslmode=require)
        sync: false
      - key: FRONTEND_ORIGIN # the Vercel site, e.g. https://clinically.vercel.app
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_BACKEND # the free plan's disk is wiped on every restart
        value: db
      - key: AUTO_VERIFY_DOCTORS
        value: "true"
      - key: TRIAL_DAYS
        value: "90"
      - key: NOTIFY_CHANNEL # "log" until WhatsApp is set up, then "whatsapp"
        value: log
      - key: WHATSAPP_TOKEN # permanent System User token from Meta Business settings
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID # WhatsApp Manager → API setup → Phone number ID
        sync: false
      - key: SITE_URL # the website, used in "forgot password" email links
        value: https://appointment-frontend-beta-six.vercel.app
      - key: EMAIL_CHANNEL # "log" until Resend is set up; then "resend" plus the two keys below
        value: log
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM # e.g. Clinically <no-reply@your-domain>; Resend's test sender works without a domain
        value: Clinically <onboarding@resend.dev>
